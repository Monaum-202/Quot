name: invoice_maker
description: "A complete, production-ready Quotation & Invoice Maker mobile app for contractors."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # File & Share
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  open_filex: ^4.3.4

  # Image Handling
  image_picker: ^1.1.0
  flutter_image_compress: ^2.2.0

  # Signature
  signature: ^5.4.0

  # UI Helpers
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
